<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      Ícone da aba: sai de public/icon-biblia.png via `npm run icon-biblia`.
      O favicon.svg não é declarado de propósito — o Chrome prefere SVG e
      mostraria o logo antigo; ele segue só como fonte dos ícones do PWA.
    -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <!--
      <title>, descrição, canônica e Open Graph entram no marcador abaixo, por
      rota, via vite/openGraph.ts. O texto de cada página fica em
      src/lib/pageMeta.ts.
    -->
    <!-- open-graph -->
    <!--
      O <link rel="manifest"> é injetado pelo vite-plugin-pwa no build. O que
      sobra aqui é o que o iOS exige por conta própria: ele ignora o manifesto
      para o ícone e para o modo tela cheia da tela de início.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bíblia" />
    <!--
      Aplica o tema antes da primeira pintura. Sem isto, o React só resolveria a
      preferência depois de montar e a página piscaria clara antes de escurecer.
      É a única lógica de tema que precisa rodar fora do React; o resto vive em
      src/theme/ThemeProvider.tsx, que lê a mesma chave.
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("biblia.theme") || "system";
          var dark =
            mode === "dark" ||
            (mode !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* localStorage bloqueado (modo privado): segue no tema claro. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
